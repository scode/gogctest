name: CI
on: [push]
jobs:
  build_go_1_27:
    name: go / 1.27 / build+test
    runs-on: ubuntu-latest
    steps:
    # Checkout has to come first: setup-go looks for go.mod to key its module
    # cache and warns "Restore cache failed" when the repository is not on disk
    # yet.
    - name: checkout code
      uses: actions/checkout@v7

    - name: setup go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
      id: go

    - name: go get
      run: |
        go get -v ./...

    - name: go build
      run: go build -v gogctest.go

    - name: go test
      run: go test -race -v ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: setup go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --max-issues-per-linter 500 --max-same-issues 500
