name: CI
on: [push]

permissions:
  contents: read

jobs:
  build_go_1_27:
    name: go / 1.27 / build+test
    runs-on: ubuntu-latest
    steps:
    # Checkout has to come first: setup-go looks for go.mod to key its module
    # cache and warns "Restore cache failed" when the repository is not on disk
    # yet.
    - name: checkout code
      uses: actions/checkout@v7

    - name: setup go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: go mod tidy
      run: go mod tidy -diff

    - name: go build
      run: go build -v ./...

    - name: go test
      run: go test -race -v ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: setup go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    # Linter selection and issue limits live in .golangci.yml so that a local
    # `golangci-lint run` uses the same configuration as CI. The version is
    # pinned because new releases add checks, which would otherwise start
    # failing CI on unchanged code; bump it deliberately. Run the same version
    # locally with:
    #   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
